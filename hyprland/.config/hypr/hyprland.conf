
################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto
source = ~/.config/hypr/monitors.conf


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = kitty -e zsh -i -c yazi
$browser = zen
$menu = rofi -show drun

#################
### AUTOSTART ###
#################

exec-once = nm-applet &
exec-once = swww-daemon &
exec-once = swww img $(find ~/Pictures/Wallpapers -type f | shuf -n 1) --transition-type fade --transition-duration 1
exec-once = hyprsunset
exec-once = waybar
exec-once = blueman-applet &
exec-once = syncthing serve
exec-once = swaync
exec-once = swayosd-server
exec-once = hypridle

#############################
### ENVIRONMENT VARIABLES ###
#############################

# Cursors (Catppuccin Mocha Dark)
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,qt6ct

# NVIDIA GTX 1660 Ti + Intel UHD 630 (i7-10700K)
# Los monitores deben estar conectados a los puertos de la GPU NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# Intel como fallback para decodificación de video (VA-API)
env = LIBVA_DRIVERS_PATH,/usr/lib64/dri
# Deshabilita VRR/tearing por defecto en NVIDIA
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgb(404994)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    dim_special = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = on
        vibrancy = 0.1696
    }
}

plugin {
    hyprscrolling {
        fullscreen_on_one_column = true
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = easeOutExpo,0.19,1,0.22,1
    bezier = elasticBounce,0.68,-0.55,0.27,1.55
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.05
    bezier = overbounce, 0.11, 1.10, 0.37, 1.2
    bezier = smoothbounce, 0.17, 0.88, 0.35, 1.22
    bezier = cartoonbounce, 0.15, 1.35, 0.25, 1.70

    animation = windows, 1, 5, overshot, popin
    animation = windowsOut, 1, 5, ease, slide bottom
    animation = windowsMove, 1, 5, overshot, slide
    animation = layers, 1, 5, ease, gnomed
    animation = fade, 1, 3, ease
    animation = border, 1, 2, ease
    animation = workspaces, 1, 5, overshot, slide
    animation = specialWorkspace, 1, 5, overshot, slidefadevert 50%
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    kb_layout = latam
    kb_model =
    kb_options = caps:capslock
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

#terminal
bind = CTRL SHIFT, T, exec, $terminal

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, I, pin
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, P, pseudo
bind = $mainMod, U, layoutmsg, togglesplit

# Apps
# En hyprland.conf
bind = $mainMod, W, exec, pgrep rofi && pkill rofi || rofi -show drun
bind = $mainMod, B, exec, $browser

# Lock / Waybar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, wlogout
bind = $mainMod SHIFT, H, exec, pkill waybar
bind = $mainMod, H, exec, waybar

# Screenshots
bind = $mainMod, A, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, A, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

# Wallpaper
bind = $mainMod, G, exec, ~/.config/rofi/scripts/wallpaper.sh

# Color picker
bind = $mainMod, P, exec, hyprpicker -a

# Notifications
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod SHIFT, N, exec, swaync-client --close-all

# Toggle audio/brightness script
bind = $mainMod, R, exec, ~/.config/hypr/Scripts/toggle-audio.sh

# Toggle keyboard layout
bind = $mainMod, K, exec, hyprctl switchxkblayout cx-2.4g-wireless-receiver next

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Cycle workspaces with ALT+TAB
bind = ALT, TAB, workspace, e+1
bind = ALT SHIFT, TAB, workspace, e-1

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Layout scroll
bind = $mainMod, mouse_up, layoutmsg, move +col
bind = $mainMod, mouse_down, layoutmsg, move -col
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod SHIFT, period, layoutmsg, movewindowto r
bind = $mainMod SHIFT, comma, layoutmsg, movewindowto l

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Volume / Brightness (con swayosd si está activo, sino fallback)
bindel = ,XF86AudioRaiseVolume, exec, pgrep -x swayosd-server && swayosd-client --output-volume raise || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, pgrep -x swayosd-server && swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, pgrep -x swayosd-server && swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = $mainMod,XF86AudioMute, exec, playerctl play-pause
bindel = ,XF86AudioMicMute, exec, pgrep -x swayosd-server && swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, pgrep -x swayosd-server && swayosd-client --brightness raise || brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, pgrep -x swayosd-server && swayosd-client --brightness lower || brightnessctl s 10%-
bindel = $mainMod,XF86AudioRaiseVolume, exec, pgrep -x swayosd-server && swayosd-client --brightness raise || hyprctl hyprsunset gamma +5
bindel = $mainMod,XF86AudioLowerVolume, exec, pgrep -x swayosd-server && swayosd-client --brightness lower || hyprctl hyprsunset gamma -5
bindel = $mainMod SHIFT,XF86AudioRaiseVolume, exec, pgrep -x swayosd-server && swayosd-client --brightness raise || hyprctl hyprsunset temperature +100
bindel = $mainMod SHIFT,XF86AudioLowerVolume, exec, pgrep -x swayosd-server && swayosd-client --brightness lower || hyprctl hyprsunset temperature -100

bind = ALT SHIFT, K, exec, pgrep -x swayosd-server && swayosd-client --output-volume raise || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ALT SHIFT, J, exec, pgrep -x swayosd-server && swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Special workspace rules
workspace = special:terminal, on-created-empty:[float; size 1000 800] kitty, persistent:false
workspace = special:code, on-created-empty:kitty nvim, persistent:false
workspace = special:obsidian, on-created-empty:obsidian, persistent:false

# Float kitty solo en special:terminal
windowrule = float 1, match:class ^(kitty)$, match:workspace special:terminal
windowrule = size 1000 800, match:class ^(kitty)$, match:workspace special:terminal
windowrule = center 1, match:class ^(kitty)$, match:workspace special:terminal

# Float rules
windowrule = float 1, match:class com.github.tenderowl.frog
windowrule = float 1, match:class ^(swayimg)$
windowrule = float 1, match:class org.pulseaudio.pavucontrol
windowrule = pin 1, match:class org.pulseaudio.pavucontrol

windowrule = float 1, match:class protonvpn-app
windowrule = size 400 600, match:class protonvpn-app

windowrule = float 1, match:class ^(blueman-manager)$
windowrule = pin 1, match:class ^(blueman-manager)$
windowrule = size 400 600, match:class ^(blueman-manager)$

# No border on floating windows
windowrule = border_size 0, match:float 1

# Suppress maximize
windowrule = suppress_event maximize, match:class .*

# swaync rules
windowrule = no_shadow 1, match:class ^(swaync)$
windowrule = no_blur 1, match:class ^(swaync)$
windowrule = float 1, match:class ^(swaync)$
windowrule = pin 1, match:class ^(swaync)$

windowrule = tag +notif, match:class ^(swaync-control-center|swaync-notification-window|swaync-client|class)$

layerrule = ignore_alpha 0.55, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = animation slide right overshot, match:namespace swaync-control-center
layerrule = animation slide, match:namespace swaync-notification-window

# Fix XWayland dragging
windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
cursor {
    no_hardware_cursors = true
}

# Passthrough para VNC: desactiva atajos locales
bind = $mainMod, F12, submap, passthrough
submap = passthrough
# dentro del submap no hay binds, así que TODO pasa a la ventana enfocada
# solo esta tecla te saca del modo:
bind = $mainMod, F12, submap, reset
submap = reset
